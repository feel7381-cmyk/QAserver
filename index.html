<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Bubble Date Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* 수정 4: 전체 페이지 배경색을 #fdfdfd로 변경 */
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: #fdfdfd; 
    }

    .container {
      padding: 16px;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 90vh; /* 내용을 하단으로 밀기 위한 설정 */
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #C88DDD, #9CEAFE);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo::after {
      content: "";
      width: 18px;
      height: 18px;
      background-color: white;
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>');
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>');
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    .lang-btn {
      background: black;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .members {
      background: linear-gradient(135deg, #C88DDD, #9CEAFE);
      border-radius: 30px;
      padding: 4px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    /* 수정 2: 멤버 이름 폰트를 흰색으로 지정 */
    .members button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      color: white; 
      transition: 0.3s;
    }

    .members .active {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: black;
      border-radius: 30px;
      padding: 6px 16px;
      margin-bottom: 16px;
      gap: 5px;
      position: relative;
    }

    .calendar-icon {
      color: white;
      cursor: pointer;
      font-size: 18px;
      margin-right: 5px;
    }

    /* 수정 1: 달력 클릭 오류 수정. 화면에서 숨기되 상호작용 가능하도록 변경 */
    #hiddenDateInput {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      border: none;
      z-index: -1;
    }

    .search-box select {
      background: transparent;
      color: white;
      border: none;
      outline: none;
      font-size: 15px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .date-separator {
      color: #777;
      font-size: 14px;
    }

    .search-btn {
      background: linear-gradient(135deg, #C88DDD, #9CEAFE);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
      margin-left: auto;
    }

    .result {
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 24px;
      min-height: 40px;
      font-size: 18px;
      cursor: pointer; /* 클릭 가능한 요소임을 표시 */
      user-select: text;
    }

    /* 수정 6: 사용방법 안내문 스타일 */
    .instructions {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .instructions strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #000;
    }

    /* 수정 6: 하단 Support 위치 조정 */
    .footer {
      border-top: 1px solid #ccc;
      padding-top: 20px;
      margin-top: auto; /* 내용물이 적어도 컨테이너 제일 하단으로 밀어냄 */
      text-align: center;
    }

    .support-link {
      color: #555;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">
      <div class="logo"></div>
      <span id="titleText">aespa bubble date finder</span>
    </div>
    <button class="lang-btn" onclick="toggleLang()">KR / EN</button>
  </div>

  <div class="members">
    <button onclick="selectMember(this)" class="active" data-sheet="Karina" data-en="Karina 💙" data-ko="카리나 💙">Karina 💙</button>
    <button onclick="selectMember(this)" data-sheet="Giselle" data-en="Giselle 🌙" data-ko="지젤 🌙">Giselle 🌙</button>
    <button onclick="selectMember(this)" data-sheet="Winter" data-en="Winter ⭐" data-ko="윈터 ⭐">Winter ⭐</button>
    <button onclick="selectMember(this)" data-sheet="Ningning" data-en="Ningning 🦋" data-ko="닝닝 🦋">Ningning 🦋</button>
  </div>

  <div class="search-box">
    <span class="calendar-icon" onclick="openCalendar()">📅</span>
    <input type="date" id="hiddenDateInput" onchange="syncFromCalendar(this.value)">
    
    <select id="yearSelect"></select>
    <span class="date-separator">-</span>
    <select id="monthSelect"></select>
    <span class="date-separator">-</span>
    <select id="daySelect"></select>
    
    <button class="search-btn" id="searchBtn" onclick="search()">search</button>
  </div>

  <div class="result" id="resultBox">Select a date and press search.</div>
  
  <div class="instructions" id="instructionsBox">
    <strong>&lt;How to Use&gt;</strong>
    1. Select a member and date, then press search.<br>
    2. Long-press or double-click the searched text to copy.<br>
    3. Paste the text into the Bubble search bar and search.<br>
    + Report errors via the support link below.
  </div>

  <div class="footer">
    <a href="https://x.com/aespaBBfinder" target="_blank" class="support-link">Support</a>
  </div>
</div>

<script>
let currentLang = "EN";

function initDateSelects() {
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const daySelect = document.getElementById("daySelect");

  const currentYear = new Date().getFullYear();
  for (let i = currentYear + 1; i >= 2020; i--) {
    let opt = new Option(i, i);
    yearSelect.add(opt);
  }
  yearSelect.value = currentYear;

  for (let i = 1; i <= 12; i++) {
    let val = i < 10 ? '0' + i : i;
    monthSelect.add(new Option(val, val));
  }

  for (let i = 1; i <= 31; i++) {
    let val = i < 10 ? '0' + i : i;
    daySelect.add(new Option(val, val));
  }
}

initDateSelects();

function openCalendar() {
  document.getElementById("hiddenDateInput").showPicker();
}

function syncFromCalendar(val) {
  if(!val) return;
  const [y, m, d] = val.split('-');
  document.getElementById("yearSelect").value = y;
  document.getElementById("monthSelect").value = m;
  document.getElementById("daySelect").value = d;
}

function toggleLang() {
  currentLang = (currentLang === "EN") ? "KO" : "EN";
  const titleText = document.getElementById("titleText");
  const searchBtn = document.getElementById("searchBtn");
  const memberButtons = document.querySelectorAll(".members button");
  const resultBox = document.getElementById("resultBox");
  const instructionsBox = document.getElementById("instructionsBox");

  if (currentLang === "KO") {
    titleText.innerText = "에스파 버블 날짜 검색기";
    searchBtn.innerText = "검색";
    memberButtons.forEach(btn => btn.innerText = btn.getAttribute("data-ko"));
    
    if(resultBox.innerText.includes("Select a date")) resultBox.innerText = "날짜를 선택하고 검색을 누르세요.";
    
    // 수정 6: 한글 사용방법으로 변경
    instructionsBox.innerHTML = `
      <strong>&lt;사용방법&gt;</strong>
      1. 원하는 멤버와 날짜를 선택한 후 검색 버튼을 누르기<br>
      2. 검색된 단어나 문장을 꾹 누르거나 더블클릭하여 복사하기<br>
      3. 버블 검색창에 해당 단어나 문장을 붙여넣기 한 후 검색하기<br>
      + 오류 신고는 하단 support 링크로 들어가 제보하기
    `;

  } else {
    titleText.innerText = "aespa bubble date finder";
    searchBtn.innerText = "search";
    memberButtons.forEach(btn => btn.innerText = btn.getAttribute("data-en"));
    
    if(resultBox.innerText.includes("날짜를 선택하고")) resultBox.innerText = "Select a date and press search.";
    
    // 수정 6: 영어 사용방법으로 변경
    instructionsBox.innerHTML = `
      <strong>&lt;How to Use&gt;</strong>
      1. Select a member and date, then press search.<br>
      2. Long-press or double-click the searched text to copy.<br>
      3. Paste the text into the Bubble search bar and search.<br>
      + Report errors via the support link below.
    `;
  }
}

function selectMember(btn) {
  document.querySelectorAll(".members button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

async function search() {
  const y = document.getElementById("yearSelect").value;
  const m = document.getElementById("monthSelect").value;
  const d = document.getElementById("daySelect").value;
  const selectedDate = `${y}-${m}-${d}`;
  
  const resultBox = document.getElementById("resultBox");
  
  // 수정 3: 이모티콘이 포함된 이름이 아닌 시트 이름(Karina, Giselle 등)만 가져옴
  const activeMember = document.querySelector(".members .active").getAttribute("data-sheet");
  
  resultBox.innerText = currentLang === "KO" ? "데이터를 불러오는 중..." : "Loading data...";
  
  const apiUrl = `https://opensheet.elk.sh/1GZMXgQHTZnHapcQui71NyFa6BVaJvzGARFECckuLFoE/${activeMember}`;

  try {
    const response = await fetch(apiUrl);
    const data = await response.json();

    if (!data || data.length === 0) {
      throw new Error("Sheet is empty");
    }

    const firstRowKeys = Object.keys(data[0]);
    const colAKey = firstRowKeys[0]; 
    const colBKey = firstRowKeys[1]; 

    const matchedRow = data.find(row => {
      const sheetDate = String(row[colBKey] || "").trim();
      return sheetDate === selectedDate;
    });

    const notFoundText = currentLang === "KO" ? "버블이 검색되지 않음" : "Bubble not found";

    if (matchedRow) {
      const colAValue = matchedRow[colAKey];
      
      if (!colAValue || String(colAValue).trim() === "") {
        resultBox.innerText = notFoundText;
      } else {
        resultBox.innerText = colAValue;
      }
    } else {
      resultBox.innerText = notFoundText;
    }

  } catch (error) {
    console.error("Error fetching data:", error);
    resultBox.innerText = currentLang === "KO" ? "데이터를 불러오는 데 실패했습니다." : "Failed to load data.";
  }
}

/* =========================================
   수정 5: 결과 텍스트 복사 기능 추가
   모바일: 꾹 누르기(Long Press) / PC: 더블 클릭
========================================= */
const resultBox = document.getElementById("resultBox");
let pressTimer;

// 복사 함수
async function copyToClipboard() {
  const text = resultBox.innerText;
  const excludeTexts = [
    "Select a date and press search.", 
    "날짜를 선택하고 검색을 누르세요.", 
    "Loading data...", 
    "데이터를 불러오는 중...", 
    "Bubble not found", 
    "버블이 검색되지 않음", 
    "Failed to load data.", 
    "데이터를 불러오는 데 실패했습니다."
  ];
  
  // 오류 메시지나 기본 안내 문구가 아닐 때만 복사 실행
  if(text && !excludeTexts.includes(text)) {
    try {
      await navigator.clipboard.writeText(text);
      alert(currentLang === "KO" ? "텍스트가 복사되었습니다." : "Text copied to clipboard.");
    } catch (err) {
      console.error('Failed to copy!', err);
    }
  }
}

// PC: 더블클릭 이벤트
resultBox.addEventListener('dblclick', copyToClipboard);

// 모바일: 꾹 누르기 (Touch 이벤트)
resultBox.addEventListener('touchstart', (e) => {
  pressTimer = setTimeout(() => {
    copyToClipboard();
  }, 700); // 0.7초 동안 누르고 있으면 복사
});

resultBox.addEventListener('touchend', () => {
  clearTimeout(pressTimer); // 손을 떼면 타이머 취소
});

resultBox.addEventListener('touchmove', () => {
  clearTimeout(pressTimer); // 누른 상태로 움직이면(스크롤 등) 타이머 취소
});
</script>

</body>
</html>
